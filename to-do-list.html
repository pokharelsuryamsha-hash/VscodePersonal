<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="to-do-list.css" />
</head>

<body>
<div class="card">
    <h1>My To-Do List</h1>
    <ul class="todo-list">
 
      <li>
        <input type="checkbox" id="task1" />
        <label for="task1">Explore gaming keyboards</label>
        <ul class="sub-item">
          <li><a class="sub-item-link" href="https://www.amazon.com/s?k=gaming+keyboards" target="_blank">Store link</a></li>
        </ul>
      </li>
 
      <li>
        <input type="checkbox" id="task2" />
        <label for="task2">Finish the report</label>
        <ul class="sub-item">
          <li><a class="sub-item-link" href="https://docs.google.com" target="_blank">Request Access</a></li>
        </ul>
      </li>
 
      <li>
        <input type="checkbox" id="task3" />
        <label for="task3">View Phone's Warranty</label>
        <ul class="sub-item">
          <li><a class="sub-item-link" href="https://www.apple.com/support/products/" target="_blank">View Receipts</a></li>
        </ul>
      </li>
 
      <li>
        <input type="checkbox" id="task4" />
        <label for="task4">Check Processor Specs</label>
        <ul class="sub-item">
          <li><a class="sub-item-link" href="https://www.intel.com/content/www/us/en/products/details/processors.html" target="_blank">View Model Number</a></li>
        </ul>
      </li>
 
    </ul>
  </div>
</body>

</html>
